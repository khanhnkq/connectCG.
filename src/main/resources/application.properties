spring.config.import=optional:file:.env[.properties]
spring.application.name=connectCG_BE
frontend.url=${FRONTEND_URL}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}

server.port=${PORT:8080}
server.forward-headers-strategy=none

# ===============================
# REDIS / RATE LIMIT
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:500ms}
spring.data.redis.repositories.enabled=false
app.environment=${APP_ENV:local}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.ai-moderation-cache.enabled=${AI_MODERATION_CACHE_ENABLED:true}
app.ai-moderation-cache.safe-ttl=${AI_MODERATION_SAFE_TTL:24h}
app.ai-moderation-cache.toxic-ttl=${AI_MODERATION_TOXIC_TTL:7d}
app.hobby-cache.enabled=${HOBBY_CACHE_ENABLED:true}
app.hobby-cache.ttl=${HOBBY_CACHE_TTL:6h}
app.public-profile-cache.enabled=${PUBLIC_PROFILE_CACHE_ENABLED:true}
app.public-profile-cache.ttl=${PUBLIC_PROFILE_CACHE_TTL:5m}

# ===============================
# MEDIA UPLOAD / MINIO
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
app.minio.bucket=${MINIO_BUCKET:connect-media}
app.media.cleanup.ttl-hours=${MEDIA_CLEANUP_TTL_HOURS:24}
app.media.cleanup.batch-size=${MEDIA_CLEANUP_BATCH_SIZE:100}
app.media.cleanup.cron=${MEDIA_CLEANUP_CRON:0 30 3 * * *}

spring.main.lazy-initialization=true
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jmx.enabled=false

# Gi?m thread pool
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# T?t devtools trong production
spring.devtools.enabled=false

# ===============================
# DATABASE
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/connect_db}
spring.datasource.username=${DB_USERNAME:connect_user}
spring.datasource.password=${DB_PASSWORD:connect_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/postgresql
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ===============================
# JWT
# ===============================
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationInMs=${JWT_EXPIRATION:900000}
app.auth.refresh-token-lifetime=${REFRESH_TOKEN_LIFETIME:30d}
app.auth.access-cookie-name=${ACCESS_COOKIE_NAME:connect_access}
app.auth.refresh-cookie-name=${REFRESH_COOKIE_NAME:connect_refresh}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:false}
app.demo-accounts.password=${DEMO_ACCOUNTS_PASSWORD:}

# ===============================
# MAIL (Local Mailpit / SMTP Server)
# ===============================
spring.mail.host=${MAIL_HOST:mail}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mail.from.email=${MAIL_FROM_EMAIL:noreply@connect.com}
mail.from.name=${MAIL_FROM_NAME:Connect App}

# ===============================
# GOOGLE GEMINI AI MODERATION
# ===============================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.prompt.version=${GEMINI_PROMPT_VERSION:v1}

# OpenRouter AI (Dự phòng)
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.model=stepfun/step-3.5-flash:free
openrouter.site.url=${SITE_URL:http://localhost:5173}
openrouter.site.name=${SITE_NAME:ConnectCG}

# ===============================
# OAUTH2 CLIENT REGISTRATION
# ===============================

# ===== GOOGLE =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# ===== FACEBOOK =====
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/facebook
